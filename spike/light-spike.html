<canvas id="game" width="960" height="540"></canvas>
<div id="rotate">Turn your phone sideways (light spike)</div>
<script>
// Spike-only: ?soft=1 forces every 2D canvas (v1's too) onto the CPU rasteriser in Chromium, as a proxy for a software Canvas 2D (Firefox Android).
(function () {
  if (/[?&]soft=1/.test(location.search)) {
    var og = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (t, o) {
      if (t === '2d') o = Object.assign({}, o || {}, { willReadFrequently: true });
      return og.call(this, t, o);
    };
  }
})();
</script>

<script>
/* HUSH MONEY - spike/light-spike.html (gfx-eng, Ilan Shapira). PERF SPIKE ONLY - not the shipped light.js.
 * Params: ?lite=1 (quarter-res buffer 240x135, 3 cones, plain blobs, 1 bake sample) | ?debug=1 (overlay; tap toggles)

  'use strict';
  var q = location.search;

  var canvas, ctx, lb, lctx;
  var cam = { x: 700, y: 786, w: 960, h: 540 };
  var i;

  // ------------------------------------------------------------ stats

  var shown = null, shownAt = 0, fps = 0, fpsT = 0, fpsN = 0;

  // ------------------------------------------------------------ light data (test set: 30 along the boulevard)
  var lights = [];
  function L(x, y, r, rgb, k, kind) { lights.push({ x: x, y: y, r: r, c: rgb, k: k, kind: kind }); }

  for (i = 22; i <= 82; i += 6) L(i * TS + 16, 28 * TS + 18, 150, AMBER, 0.95, 'lamp');      // north sidewalk lamps (11)
  for (i = 25; i <= 85; i += 6) L(i * TS + 16, 37 * TS + 10, 150, AMBER, 0.95, 'lamp');      // south sidewalk lamps (11)
  L(22 * TS + 56, 33 * TS, 125, COOL, 0.95, 'kiosk');                                         // west kiosk, east of it
  L(84 * TS - 10, 33 * TS, 125, COOL, 0.95, 'kiosk');                                         // east kiosk, west of it

  L(58 * TS, 37 * TS + 8, 95, PINK, 0.9, 'neon'); L(70 * TS, 28 * TS + 10, 100, PINK, 0.9, 'neon');

  var occ = [];            // px rects [x0,y0,x1,y1]
  var chLamp = new Array(NCX * NCY), chFixed = new Array(NCX * NCY);
  var bake = { ms: 0, chunks: 0, bytes: 0, lights: 0, occ: 0, samples: 0 };

  function mkc(w, h, o) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  function addShadow(t, o, lx, ly, far) {

    for (i = 0; i < city.buildings.length; i++) { var b = city.buildings[i]; occ.push([b.x * TS, b.y * TS, (b.x + b.w) * TS, (b.y + b.h) * TS]); }

        gr.addColorStop(0, 'rgba(' + col + ',' + l.k + ')'); gr.addColorStop(0.25, 'rgba(' + col + ',' + (l.k * 0.7) + ')');
        gr.addColorStop(0.5, 'rgba(' + col + ',' + (l.k * 0.38) + ')'); gr.addColorStop(0.75, 'rgba(' + col + ',' + (l.k * 0.14) + ')');

        for (var cy = Math.max(0, Math.floor(gy0 / CHL)); cy <= Math.min(NCY - 1, Math.floor((gy0 + tsz) / CHL)); cy++) {
          for (var cx = Math.max(0, Math.floor(gx0 / CHL)); cx <= Math.min(NCX - 1, Math.floor((gx0 + tsz) / CHL)); cx++) {
            var idx = cy * NCX + cx;
            if (!layer[idx]) { layer[idx] = mkc(CHL, CHL); bake.chunks++; bake.bytes += CHL * CHL * 4; }
            var cc = layer[idx].getContext('2d');
            cc.globalCompositeOperation = 'lighter'; cc.globalAlpha = 1 / ns;
            cc.drawImage(tmp, Math.round(gx0 - cx * CHL), Math.round(gy0 - cy * CHL));

  }

  // ------------------------------------------------------------ sprites (built once)
  var coneSpr, glowSpr, blobSpr, CONE_LEN = 150;
  function buildSprites() {
    var h = Math.ceil(2 * CONE_LEN * Math.sin(35 * Math.PI / 180) * S) + 2, w = Math.ceil(CONE_LEN * S) + 2, t;
    coneSpr = mkc(w, h); t = coneSpr.getContext('2d');
    var gr = t.createRadialGradient(0, h / 2, 0, 0, h / 2, CONE_LEN * S);
    gr.addColorStop(0, 'rgba(255,244,210,0.85)'); gr.addColorStop(0.5, 'rgba(255,236,190,0.4)'); gr.addColorStop(1, 'rgba(255,230,170,0)');

    gr = t.createRadialGradient(gs / 2, gs / 2, 0, gs / 2, gs / 2, 34 * S);
    gr.addColorStop(0, 'rgba(255,240,200,0.7)'); gr.addColorStop(1, 'rgba(255,240,200,0)'); t.fillStyle = gr; t.fillRect(0, 0, gs, gs);

    gr = t.createRadialGradient(16, 8, 0, 16, 8, 16); gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(0.6, 'rgba(0,0,0,0.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    t.setTransform(1, 0, 0, 0.5, 0, 0); t.fillStyle = gr; t.fillRect(0, 0, 32, 32);
  }

  // ------------------------------------------------------------ environment: dusk -> night, colour + lamp level only
  var KEYS = [[0, [232, 154, 106], 1.0], [0.5, [122, 90, 158], 0.6], [1, [42, 44, 88], 0.35]];
  function norm(c) { var m = Math.max(c[0], c[1], c[2]); return [c[0] / m, c[1] / m, c[2] / m]; }

  var env = { p: 0, ambient: 1, lamp: 0, rgb: 'rgb(255,255,255)' }, lastAmbKey = -1;
  function sm(a, b, x) { x = (x - a) / (b - a); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }

    else { var u = clock % 70; p = u < 60 ? u / 60 : u < 64 ? 1 : 1 - sm(0, 6, u - 64); }

    var R = Math.round(r * 255), G = Math.round(g * 255), B = Math.round(bl * 255), key = (R << 16) | (G << 8) | B;
    if (key !== lastAmbKey) { lastAmbKey = key; env.rgb = 'rgb(' + R + ',' + G + ',' + B + ')'; }
  }

  // ------------------------------------------------------------ world actors: crowd + headlight cars
  var rng = PE.logic.mulberry32(777), crowd = [], cars = [], vis = [];
  var CAR_COLORS = ['#C0392B', '#E8E4D8', '#2E6FBF', '#E0A52E', '#3A3A44', '#6A8E3A'];
  function initActors() {
    var bands = [[905, 925], [1000, 1105], [1188, 1212]], j;
    for (j = 0; j < NCROWD; j++) {
      var bd = bands[Math.floor(rng() * 3)], sp = 20 + rng() * 28, east = rng() < 0.5;
      crowd.push({ x: cam.x - 100 + rng() * 1160, y: bd[0] + rng() * (bd[1] - bd[0]), vx: east ? sp : -sp, look: 'amb' + Math.floor(rng() * 24), dir: east ? 2 : 6, animT: rng() * 5, moving: true, prop: 'none' });
    }
    for (j = 0; j < NCARS; j++) {
      var east2 = j % 2 === 0, lane = Math.floor(j / 2) % 2;
      cars.push({ x: 620 + rng() * 2100, y: east2 ? (lane ? 1168 : 1136) : (lane ? 976 : 944), v: (east2 ? 1 : -1) * (85 + rng() * 55), dir: east2 ? 2 : 6, color: CAR_COLORS[j % 6] });
    }
  }
  var PANMIN = 500, PANMAX = 1900;

    }
  }

    cam.x = Math.round(PANMIN + range * (t * t * (3 - 2 * t))); cam.y = 786;
  }

  // ------------------------------------------------------------ light pass pieces
  var tB = 0, nShadows = 0, nChunks = 0, nCones = 0, FAKE_PLAYER = { x: 0, y: 0 };

  }
  function drawLight(am, clock) {
    var j, cx, cy;
    lctx.globalCompositeOperation = 'source-over'; lctx.globalAlpha = 1; lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.fillStyle = OVER ? 'rgba(20,24,64,0.75)' : env.rgb; lctx.globalCompositeOperation = 'copy'; lctx.fillRect(0, 0, LW, LH); lctx.globalCompositeOperation = 'lighter';

    var cx0 = Math.floor(cam.x / CPX), cx1 = Math.min(NCX - 1, Math.floor((cam.x + 959) / CPX)), cy0 = Math.floor(cam.y / CPX), cy1 = Math.min(NCY - 1, Math.floor((cam.y + 539) / CPX));

  }
  function flush() { ctx.getImageData(0, 0, 1, 1); }
  function byY(a, b) { return a.y - b.y; }

  // ------------------------------------------------------------ frame

    tl1 = performance.now(); shMs = tl1 - tl0;
    var vs = npc.vehicles;
    for (j = 0; j < vs.length; j++) { var v = vs[j], vx = Math.round(v.x - cam.x), vy = Math.round(v.y - cam.y); if (vx > -64 && vy > -64 && vx < 1024 && vy < 604) art.drawVehicle(ctx, vx, vy, v.type, v.dir, v.color); }
    for (j = 0; j < cars.length; j++) { var c = cars[j], cx = Math.round(c.x - cam.x), cy = Math.round(c.y - cam.y); if (cx > -64 && cx < 1024) art.drawVehicle(ctx, cx, cy, 'car', c.dir, c.color); }
    for (j = 0; j < vis.length; j++) { var p = vis[j]; art.drawCharacter(ctx, Math.round(p.x - cam.x), Math.round(p.y - cam.y), p.look, p.dir, p.animT, p.moving, p.prop); }
    npc.drawExtras(ctx, cam);
    city.drawTop(ctx, cam, clock);
    if (SYNC) flush();
    tl2 = performance.now();
    for (j = 0; j < REP; j++) drawLight(j === 0 ? 1 : 0.01, clock);
    if (SYNC) flush();
    var tl3 = performance.now();
    lightMs = shMs + (tl3 - tl2);
    if (SYNC && REP === 1) { stBuf.add(tB - tl2); stComp.add(tl3 - tB); flush(); stFlush.add(performance.now() - tl3); }
    stLight.add(lightMs); stShadow.add(shMs);
    drawHud(now);
    stCpu.add(performance.now() - tf0);
  }

  function drawHud(now) {
    ctx.font = 'bold 11px Verdana, sans-serif'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    var tag = 'HUSH MONEY light spike  ' + (LITE ? 'LITE' : 'FULL') + (SOFT ? ' soft' : '') + (REP > 1 ? ' x' + REP : '') + '  ' + Math.round(fps) + ' fps' + (DEBUG ? '' : '  (tap: stats)');
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(4, 520, ctx.measureText(tag).width + 10, 16); ctx.fillStyle = '#fff'; ctx.fillText(tag, 9, 523);
    if (!DEBUG) return;
    if (now - shownAt > 500) {
      shownAt = now;
      shown = [
        'FPS ' + fps.toFixed(0) + '   ' + (LITE ? 'LITE' : 'FULL') + ' buf ' + LW + 'x' + LH + '  soft=' + (SOFT ? 1 : 0) + ' rep=' + REP + ' sync=' + (SYNC ? 1 : 0),
        'light ms  p50 ' + stLight.pct(600, 0.5).toFixed(2) + '  p99 ' + stLight.pct(600, 0.99).toFixed(2) + '   (shadows p50 ' + stShadow.pct(600, 0.5).toFixed(2) + ')',
        (REP > 1 ? 'per pass  p50 ' + (stLight.pct(600, 0.5) / REP).toFixed(2) + '  p99 ' + (stLight.pct(600, 0.99) / REP).toFixed(2) + '   [x' + REP + ' emulated]' : 'frame cpu ms p50 ' + stCpu.pct(600, 0.5).toFixed(2) + '  p99 ' + stCpu.pct(600, 0.99).toFixed(2)),
        'frame ms  p50 ' + stFrame.pct(600, 0.5).toFixed(2) + '  p99 ' + stFrame.pct(600, 0.99).toFixed(2) + '   cpu p99 ' + stCpu.pct(600, 0.99).toFixed(2),
        'shadows ' + nShadows + '  cones ' + nCones + '  chunks drawn ' + nChunks + '  lights ' + bake.lights + '  occluders ' + bake.occ,
        'bake ' + bake.ms.toFixed(0) + ' ms  chunks ' + bake.chunks + '  ' + (bake.bytes / 1048576).toFixed(2) + ' MB (+buf ' + (LW * LH * 4 / 1024).toFixed(0) + ' KB)',
        'phase ' + env.p.toFixed(2) + '  ambient ' + env.ambient.toFixed(2) + '  lamps ' + env.lamp.toFixed(2) + '  cam ' + cam.x
      ];
    }
    if (!shown) return;
    ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(4, 4, 520, shown.length * 14 + 6); ctx.fillStyle = '#fff';
    for (var j = 0; j < shown.length; j++) ctx.fillText(shown[j], 8, 7 + j * 14);
  }

  // ------------------------------------------------------------ boot
  function boot() {
    canvas = document.getElementById('game'); ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
    lb = mkc(LW, LH); lctx = lb.getContext('2d', { alpha: OVER });
    PE.art.init(); PE.city.init(); PE.city.initGraphics(); PE.npc.init(PE.logic.mulberry32(12345));
    buildSprites(); doBake(); initActors();
    canvas.addEventListener('pointerdown', function () { DEBUG = !DEBUG; shown = null; shownAt = 0; });
    window.addEventListener('keydown', function (e) { if (e.code === 'Backquote') { DEBUG = !DEBUG; shown = null; shownAt = 0; } });
    document.addEventListener('visibilitychange', function () { last = 0; prevNow = 0; });
    function st(s) { return { p50: +s.pct(4096, 0.5).toFixed(3), p99: +s.pct(4096, 0.99).toFixed(3), max: +s.pct(4096, 1).toFixed(3), n: s.n }; }
    window.__spike = {
      reset: function () { stLight.reset(); stBuf.reset(); stComp.reset(); stFlush.reset(); stFrame.reset(); stCpu.reset(); stShadow.reset(); },
      stats: function () { return { tier: LITE ? 'lite' : 'full', soft: SOFT, rep: REP, sync: SYNC, light: st(stLight), buf: st(stBuf), comp: st(stComp), flushOverhead: st(stFlush), shadows: st(stShadow), frame: st(stFrame), cpu: st(stCpu), fps: Math.round(fps), nShadows: nShadows, nCones: nCones, nChunks: nChunks, phase: env.p }; },
      bake: bake, buf: [LW, LH], heapMB: performance.memory ? performance.memory.usedJSHeapSize / 1048576 : null,
      cityGfxMs: PE.city.gfxMs, artInitMs: PE.art.initMs
    };
    requestAnimationFrame(frame);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(globalThis.PE);
</script>
