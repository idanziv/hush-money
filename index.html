<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>HUSH MONEY</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  body {
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    width: min(100vw, calc(100dvh * 16 / 9));
    height: min(100dvh, calc(100vw * 9 / 16));
    background: #000;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    outline: none;
    touch-action: none;
  }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 2; background: #0C0812;
    color: #FFD23F; font: bold 20px Verdana, sans-serif; text-align: center;
    align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
  }
  @media (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" width="960" height="540" tabindex="0"></canvas>
<div id="rotate">Turn your phone sideways to play HUSH MONEY</div>
<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/art.js"></script>
<script src="js/city.js"></script>
<script src="js/npc.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/sfx.js"></script>
<script src="js/touch.js"></script>
<script src="js/main.js"></script>
</body>
</html>
